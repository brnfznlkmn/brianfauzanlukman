<!DOCTYPE html>
<html lang="en">

<head>

    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absen</title>
</head>

<body>
    <!-- ganti src url dengan url form anda -->
    <iframe id="gform"
        src="https://docs.google.com/forms/d/e/1FAIpQLSfTf1sPKfDGJnKaRFFKYC__dp2P-_-XaaFXHSJBJgFtB6EPoQ/viewform"
        width="100%" height="1080" frameborder="0" marginheight="0" marginwidth="0">Loading…</iframe>

    <script type="text/javascript">
        var load = 0;
        // sesuaikan id gform dengan id yang ada pada tag iframe di atas
        document.getElementById('gform').onload = function () {
            load++;
            if (load > 1) {
                // ganti url dibawah dengan url webapp anda
                document.location = "https://script.google.com/macros/s/AKfycbydn1Gh3gCR9Q63A_OVgOhYZWnTdaLk63SNNztnAel9n6XlBCz3bt-965laXpijC9XQdg/exec";

            }
        }
    </script>
</body>

</html>
