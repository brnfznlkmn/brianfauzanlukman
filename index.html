<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <script src="script.js"></script>
    <script>
        (function () {
            var theme = localStorage.getItem('theme') === 'dark' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="respect my privacy.">
    <meta name="author" content="Brian Fauzan Lukman">
    <title>respect my privacy.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="assets/favicon.png">

    <style>
        :root {
            --bg: #ffffff;
            --text: #0d0d0d;
            --muted: #6b6b6b;
            --accent1: #7c5cff;
            --accent2: #ff5c8a;
            --accent3: #ffd23f;
            --card: #f5f5f7;
            --border: rgba(0,0,0,0.08);
        }

        html[data-theme="dark"] {
            --bg: #0d0d10;
            --text: #f5f5f7;
            --muted: #a0a0a8;
            --accent1: #a78bfa;
            --accent2: #ff8fab;
            --accent3: #ffe066;
            --card: #17171b;
            --border: rgba(255,255,255,0.08);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
            overflow-x: hidden;
            transition: background .3s ease, color .3s ease;
        }

        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: .45;
            z-index: 0;
            pointer-events: none;
        }
        .blob1 { width: 320px; height: 320px; background: var(--accent1); top: -80px; left: -80px; animation: float1 9s ease-in-out infinite; }
        .blob2 { width: 280px; height: 280px; background: var(--accent2); bottom: -60px; right: -60px; animation: float2 11s ease-in-out infinite; }
        .blob3 { width: 200px; height: 200px; background: var(--accent3); top: 40%; right: 10%; animation: float1 7s ease-in-out infinite; opacity: .3; }

        @keyframes float1 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(30px,25px); } }
        @keyframes float2 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-25px,-20px); } }

        .theme-toggle-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            border: 1.5px solid var(--border);
            background: var(--card);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.05rem;
            cursor: pointer;
            transition: transform .2s ease, background .3s ease;
        }
        .theme-toggle-btn:active { transform: scale(0.9); }
        html[data-theme="light"] .theme-icon-moon,
        html[data-theme="dark"] .theme-icon-sun { display: none; }

        .wrap {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 32px 20px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 999px;
            background: var(--card);
            border: 1px solid var(--border);
            font-size: .8rem;
            font-weight: 600;
            color: var(--muted);
            margin-bottom: 28px;
        }
        .badge .dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--accent3);
            box-shadow: 0 0 0 0 rgba(255,210,63,.6);
            animation: pulse 1.8s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255,210,63,.5); }
            70% { box-shadow: 0 0 0 10px rgba(255,210,63,0); }
            100% { box-shadow: 0 0 0 0 rgba(255,210,63,0); }
        }

        h1 {
            font-size: clamp(2.6rem, 9vw, 5.2rem);
            font-weight: 800;
            line-height: 1.05;
            margin: 0 0 8px;
            letter-spacing: -0.03em;
        }
        h1 .grad {
            background: linear-gradient(90deg, var(--accent1), var(--accent2));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-decoration: underline;
            text-decoration-thickness: 6px;
            text-underline-offset: 8px;
            text-decoration-color: var(--accent3);
        }

        .desc {
            max-width: 480px;
            color: var(--muted);
            font-size: clamp(1rem, 2.6vw, 1.15rem);
            margin: 20px auto 8px;
            line-height: 1.6;
        }

        .desc strong { color: var(--text); }

        .emoji-row {
            font-size: 1.6rem;
            margin-top: 6px;
            margin-bottom: 34px;
        }
        .emoji-row span { display: inline-block; animation: bob 2.4s ease-in-out infinite; }
        .emoji-row span:nth-child(2) { animation-delay: .2s; }
        .emoji-row span:nth-child(3) { animation-delay: .4s; }
        @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

        .socials {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .socials a {
            width: 46px; height: 46px;
            border-radius: 14px;
            background: var(--card);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
            font-size: 1.1rem;
            text-decoration: none;
            transition: transform .15s ease, border-color .15s ease;
        }
        .socials a:hover { transform: translateY(-4px); border-color: var(--accent1); color: var(--accent1); }

        footer.note {
            position: relative;
            z-index: 1;
            text-align: center;
            font-size: .78rem;
            color: var(--muted);
            padding: 18px 20px 28px;
        }

        @media (max-width: 480px) {
            .badge { font-size: .72rem; padding: 7px 14px; }
            .socials a { width: 42px; height: 42px; }
        }
    </style>
</head>

<body>

    <div class="blob blob1"></div>
    <div class="blob blob2"></div>
    <div class="blob blob3"></div>

    <button class="theme-toggle-btn" id="theme-toggle" aria-label="Ganti mode tampilan (terang/gelap)">
        <i class="fa-solid fa-sun theme-icon-sun"></i>
        <i class="fa-solid fa-moon theme-icon-moon"></i>
    </button>

    <div class="wrap">

        <h1>apa sih yang dicari?</h1>

        <p class="desc">
            this site is currently under maintenance,<br>
            come back next time.
        </p>

        <div class="emoji-row">
            <span>🛠️</span>
        </div>

        <div class="socials">
            <a href="https://github.com/brnfznlkmn" target="_blank" rel="noopener" aria-label="GitHub"><i class="fa-brands fa-github"></i></a>
            <a href="mailto:brnfznlkmn@gmail.com" aria-label="Email"><i class="fa-solid fa-envelope"></i></a>
        </div>
    </div>

    <footer class="note">
        &copy; 2026 Brian Fauzan Lukman. All Rights Reserved.
    </footer>

    <script>
        // Theme toggle functionality (preserved)
        (function () {
            var toggleBtn = document.getElementById('theme-toggle');
            if (!toggleBtn) return;
            toggleBtn.addEventListener('click', function () {
                var current = document.documentElement.getAttribute('data-theme');
                var next = current === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', next);
                localStorage.setItem('theme', next);
            });
        })();
    </script>
</body>

</html>
