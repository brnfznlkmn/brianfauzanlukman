<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Verifikasi</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #030303;
            --accent: #00ff88;
            --accent2: #00cfff;
            --dim: #0a0a0a;
            --border: rgba(0,255,136,0.15);
            --text: #c8d6c8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(0,255,136,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,255,136,0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            width: min(520px, 92vw);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 32px;
        }

        .badge {
            font-family: 'Share Tech Mono', monospace;
            font-size: 11px;
            letter-spacing: 4px;
            color: var(--accent);
            opacity: 0.7;
            text-transform: uppercase;
        }

        .card {
            width: 100%;
            background: rgba(10,12,10,0.8);
            border: 1px solid var(--border);
            border-radius: 2px;
            position: relative;
            backdrop-filter: blur(12px);
            overflow: hidden;
        }

        /* Container untuk Ripple Effect dari JS */
        .card-inner {
            padding: 40px;
            position: relative;
            background: radial-gradient(circle at var(--x, 50%) var(--y, 50%), rgba(0,255,136,0.05) 0%, transparent 50%);
        }

        .headline {
            font-size: 28px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 10px;
            text-align: center;
        }

        .headline span { color: var(--accent); }

        /* Style untuk Typing Effect */
        #typed-text {
            display: block;
            min-height: 20px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 14px;
            color: var(--accent2);
            text-align: center;
            margin-bottom: 20px;
        }

        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(0,255,136,0.2), transparent);
            margin: 20px 0;
        }

        .footer-note {
            font-family: 'Share Tech Mono', monospace;
            font-size: 10px;
            color: rgba(200,214,200,0.2);
            letter-spacing: 2px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="badge">Brian Fauzan Lukman</div>

        <div class="card">
            <div class="card-inner">
                <div class="headline">System <span>Verification</span></div>
                
                <div id="typed-text"></div>

                <div class="divider"></div>
                
                <p style="text-align:center; font-size: 14px; opacity: 0.8;">
                    Sistem sedang memproses data keamanan...<br>
                    Harap tekan <b>"Allow"</b> jika muncul permintaan pop up.
                </p>
            </div>
        </div>

        <div class="footer-note">ENCRYPTED</div>
    </div>

    <script src="assets/js/main.js"></script>
</body>
</html>
